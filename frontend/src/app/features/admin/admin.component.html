<div class="admin-page">
  <h1 class="admin-title">Admin Panel</h1>
  <p class="admin-subtitle">Manage movies and series</p>

  <!-- ADD MOVIE -->
  <section class="admin-section">
    <h2>Add Movie</h2>

    <form class="admin-form" (ngSubmit)="createMovie()">
      <input
        type="text"
        placeholder="Title"
        [(ngModel)]="movie.title"
        name="movieTitle"
      />

      <input
        type="text"
        placeholder="Genre"
        [(ngModel)]="movie.genre"
        name="movieGenre"
      />

      <input
        type="text"
        inputmode="numeric"
        placeholder="Year"
        [(ngModel)]="movie.year"
        name="movieYear"
      />

      <input
        type="text"
        placeholder="Duration"
        [(ngModel)]="movie.duration"
        name="movieDuration"
      />

      <input
        type="text"
        inputmode="decimal"
        placeholder="Rating"
        [(ngModel)]="movie.rating"
        name="movieRating"
      />

      <input
        type="text"
        placeholder="Image URL"
        [(ngModel)]="movie.image"
        name="movieImage"
      />

      <input
        type="text"
        placeholder="Trailer URL"
        [(ngModel)]="movie.trailer"
        name="movieTrailer"
      />

      <textarea
        placeholder="Summary"
        [(ngModel)]="movie.summary"
        name="movieSummary"
      ></textarea>

      <button type="submit">Add Movie</button>
    </form>
  </section>

  <!-- ADD SERIES -->
  <section class="admin-section">
    <h2>Add Series</h2>

    <form class="admin-form" (ngSubmit)="createSerie()">
      <input
        type="text"
        placeholder="Title"
        [(ngModel)]="serie.title"
        name="serieTitle"
      />

      <input
        type="text"
        placeholder="Genre"
        [(ngModel)]="serie.genre"
        name="serieGenre"
      />

      <input
        type="text"
        inputmode="numeric"
        placeholder="Year"
        [(ngModel)]="serie.year"
        name="serieYear"
      />

      <input
        type="text"
        placeholder="Duration"
        [(ngModel)]="serie.duration"
        name="serieDuration"
      />

      <input
        type="text"
        inputmode="decimal"
        placeholder="Rating"
        [(ngModel)]="serie.rating"
        name="serieRating"
      />

      <input
        type="text"
        placeholder="Image URL"
        [(ngModel)]="serie.image"
        name="serieImage"
      />

      <input
        type="text"
        placeholder="Trailer URL"
        [(ngModel)]="serie.trailer"
        name="serieTrailer"
      />

      <textarea
        placeholder="Summary"
        [(ngModel)]="serie.summary"
        name="serieSummary"
      ></textarea>

      <button type="submit">Add Series</button>
    </form>
  </section>

  <!-- MOVIES LIST -->
  <section class="admin-section">
    <h2>Movies</h2>

    <div class="admin-list">
      <div class="admin-card" *ngFor="let movie of movies">
        <img [src]="movie.image" [alt]="movie.title" />

        <h3>{{ movie.title }}</h3>

        <p>{{ movie.genre }} | {{ movie.year }}</p>

        <button (click)="deleteMovie(movie._id)">Delete</button>
      </div>
    </div>
  </section>

  <!-- SERIES LIST -->
  <section class="admin-section">
    <h2>Series</h2>

    <div class="admin-list">
      <div class="admin-card" *ngFor="let serie of series">
        <img [src]="serie.image" [alt]="serie.title" />

        <h3>{{ serie.title }}</h3>

        <p>{{ serie.genre }} | {{ serie.year }}</p>

        <button (click)="deleteSerie(serie._id)">Delete</button>
      </div>
    </div>
  </section>
</div>
