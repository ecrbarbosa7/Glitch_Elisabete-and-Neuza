<header class="navbar">
  <div class="logo">
    <img
      src="https://i.pinimg.com/1200x/fe/5f/16/fe5f160b50bcf8d453a6952d8dff204b.jpg"
      alt="Logo"
      class="logo-image"
    />

    <h2>Neural Stream Active</h2>
  </div>

  <nav>
    <a routerLink="/home">Home</a>

    <a routerLink="/movies">Movies</a>

    <a routerLink="/series">Series</a>

    <!-- APENAS UTILIZADOR LOGADO -->
    <a
      *ngIf="isLoggedIn()"
      routerLink="/favorites"
    >
      Favorites
    </a>

    <!-- APENAS VISITANTE -->
    <a
      *ngIf="!isLoggedIn()"
      routerLink="/login"
    >
      Login
    </a>

    <!-- APENAS VISITANTE -->
    <a
      *ngIf="!isLoggedIn()"
      routerLink="/register"
      class="register-btn"
    >
      Register
    </a>

    <!-- APENAS UTILIZADOR LOGADO -->
    <button
      *ngIf="isLoggedIn()"
      class="logout-btn"
      (click)="logout()"
    >
      Logout
    </button>
  </nav>
</header>

<router-outlet></router-outlet>
